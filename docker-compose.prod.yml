services:
  # PostgreSQL Database
  database:
    image: postgres:16-alpine
    container_name: linkwise-db-prod
    environment:
      POSTGRES_USER: ${DB_USER:-linkwise_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-linkwise_password}
      POSTGRES_DB: ${DB_NAME:-linkwise_db}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
    networks:
      - linkwise-network-prod
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-linkwise_user}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend Service (Production)
  backend:
    build:
      context: ./src/linkwise-core
      dockerfile: Dockerfile
      target: production
    container_name: linkwise-backend-prod
    environment:
      NODE_ENV: production
      DB_HOST: database
      DB_PORT: ${DB_PORT:-5432}
      DB_USER: ${DB_USER:-linkwise_user}
      DB_PASSWORD: ${DB_PASSWORD:-linkwise_password}
      DB_NAME: ${DB_NAME:-linkwise_db}
      BACKEND_PORT: ${BACKEND_PORT:-8080}
    ports:
      - "${BACKEND_PORT:-8080}:${BACKEND_PORT:-8080}"
    depends_on:
      database:
        condition: service_healthy
    networks:
      - linkwise-network-prod
    restart: unless-stopped

  # Nginx Reverse Proxy (Production)
  nginx:
    image: nginx:alpine
    container_name: linkwise-nginx-prod
    ports:
      - "8080:8080"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - backend
      - frontend
    networks:
      - linkwise-network-prod
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  # Frontend Service (Production)
  frontend:
    build:
      context: ./src/linkwise-front
      dockerfile: Dockerfile
    container_name: linkwise-frontend-prod
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:8080}
    expose:
      - "3000"
    depends_on:
      - backend
    networks:
      - linkwise-network-prod
    restart: unless-stopped

networks:
  linkwise-network-prod:
    driver: bridge

volumes:
  postgres_data_prod:
    driver: local
