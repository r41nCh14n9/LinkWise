spring:
  application:
    name: linkwise-core

  # Database Configuration
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:linkwise_db}
    username: ${DB_USER:linkwise_user}
    password: ${DB_PASSWORD:linkwise_password}
    driver-class-name: org.postgresql.Driver
    
  # SQL Initialization
  sql:
    init:
      mode: never
      data-locations: classpath:data/admin-user-init.sql
      continue-on-error: true

  # JPA/Hibernate Configuration
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        use_sql_comments: true
    show-sql: false
    open-in-view: false

  # Logging Configuration
  output:
    ansi:
      enabled: always

# Server Configuration
server:
  port: 8080
  servlet:
    context-path: /
  compression:
    enabled: true

# Logging Configuration
logging:
  level:
    root: INFO
    com.linkwise: DEBUG
    org.springframework.web: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

# Actuator Configuration
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

# API Documentation (Swagger/OpenAPI)
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    operations-sorter: method
    tags-sorter: alpha
  servers:
    - name: "Local Development"
      url: "http://localhost:8080"
      description: "Development environment"
    - name: "Local Frontend"
      url: "http://localhost:3000"
      description: "Frontend development environment"
