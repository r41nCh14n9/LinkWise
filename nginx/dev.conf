# Nginx 開發環境配置 - 前後端都通過代理

# DNS 解析器（使用 Docker 的嵌入式 DNS）
resolver 127.0.0.11 valid=10s;
resolver_timeout 5s;

# HTTP 伺服器塊 - 前端 Nginx (3000) 和後端直接 (8080)
server {
    listen 3000;
    server_name _;
    
    # 設置上游服務變量（用於動態DNS解析）
    set $backend_server "backend:8080";
    set $frontend_server "frontend:3000";
    
    # 移除敏感信息
    server_tokens off;
    
    # 安全頭部（開發環境寬鬆）
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    
    # 移除伺服器信息
    proxy_hide_header X-Powered-By;
    proxy_hide_header Server;
    
    # 客戶端請求體大小限制
    client_max_body_size 10M;
    
    # 健康檢查端點
    location = /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }
    
    # 後端 API 代理
    location /api/ {
        proxy_pass http://$backend_server;
        proxy_http_version 1.1;
        
        # 代理頭部設定
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # 緩存禁用 - 開發環境
        proxy_no_cache 1;
        proxy_cache_bypass 1;
        
        # 重定向處理
        proxy_redirect off;
    }
    
    # Swagger UI 代理
    location /swagger-ui.html {
        proxy_pass http://$backend_server;
        proxy_set_header Host $host;
    }
    
    # Swagger UI 路徑
    location /swagger-ui/ {
        proxy_pass http://$backend_server;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    
    # Swagger UI 資源（CSS, JS 等）
    location /webjars/ {
        proxy_pass http://$backend_server;
        proxy_set_header Host $host;
    }
    
    # API 文檔
    location /v3/api-docs {
        proxy_pass http://$backend_server;
        proxy_set_header Host $host;
    }
    
    # Actuator 端點
    location /actuator/ {
        proxy_pass http://$backend_server;
        proxy_set_header Host $host;
    }
    
    # 前端應用
    location / {
        proxy_pass http://$frontend_server;
        proxy_http_version 1.1;
        
        # 代理頭部設定
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # 開發環境：禁用所有緩存
        proxy_cache_bypass $http_pragma $http_authorization;
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }
}

# HTTP 伺服器塊 - 後端直接代理 (8080)
server {
    listen 8080;
    server_name _;
    
    set $backend_server "backend:8080";
    
    # 移除敏感信息
    server_tokens off;
    
    # 安全頭部
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    
    # 客戶端請求體大小限制
    client_max_body_size 10M;
    
    # 健康檢查端點
    location = /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }
    
    # 所有其他請求轉發到後端
    location / {
        proxy_pass http://$backend_server;
        proxy_http_version 1.1;
        
        # 代理頭部設定
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header X-Forwarded-Host $host;
        
        # 確保 CORS 頭從後端正確傳遞
        proxy_pass_header Access-Control-Allow-Origin;
        proxy_pass_header Access-Control-Allow-Methods;
        proxy_pass_header Access-Control-Allow-Headers;
        proxy_pass_header Access-Control-Allow-Credentials;
        proxy_pass_header Access-Control-Max-Age;
        proxy_pass_header Vary;
        
        # 緩存禁用 - 開發環境
        proxy_no_cache 1;
        proxy_cache_bypass 1;
    }
}
